services:
  db:
    image: postgres:18
    container_name: keepeat-db
    profiles: ["local"]
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - keepeat-db-data:/var/lib/postgresql

  app:
    build: .
    container_name: keepeat-app
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "${APP_PORT_MAPPING:-8080:8080}"
    volumes:
      - "${TLS_CERTS_DIR:-./letsencrypt}:/etc/letsencrypt:ro,z"
    restart: unless-stopped

volumes:
  keepeat-db-data:
