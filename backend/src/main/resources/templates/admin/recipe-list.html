<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{admin/layout :: head('레시피 관리')}"></head>
<body class="bg-light">
<nav th:replace="~{admin/layout :: nav}"></nav>

<div class="container my-4">

    <!-- 페이지 제목 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">레시피</h3>
    </div>

    <!-- 결과 메시지  -->
    <div th:if="${msg}" class="alert"
         th:classappend="${msg == 'deleted'} ? 'alert-success' : 'alert-warning'"
         role="alert">
        <span th:if="${msg == 'deleted'}">레시피가 삭제되었습니다.</span>
        <span th:if="${msg == 'delete_blocked'}">사용자가 내 레시피로 등록한 레시피는 삭제할 수 없습니다.</span>
        <span th:if="${msg == 'delete_failed'}">삭제에 실패했습니다.</span>
    </div>

    <!-- 검색창 -->
    <form method="get" action="/admin/recipes" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="레시피명 검색">
        </div>
        <div class="col-md-3">
            <select name="sort" class="form-select">
                <option value="LATEST"
                        th:selected="${sort.name() == 'LATEST'}">최신순</option>
                <option value="LIKES_DESC"
                        th:selected="${sort.name() == 'LIKES_DESC'}">좋아요 많은 순</option>
                <option value="DISLIKES_DESC"
                        th:selected="${sort.name() == 'DISLIKES_DESC'}">싫어요 많은 순</option>
                <option value="BOOKMARKED_ASC"
                        th:selected="${sort.name() == 'BOOKMARKED_ASC'}">등록자 적은 순</option>
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="onlyDeletable"
                       name="onlyDeletable" value="true"
                       th:checked="${onlyDeletable}">
                <label class="form-check-label" for="onlyDeletable">
                    등록자 0명만 보기
                </label>
            </div>
        </div>
        <div class="col-md-1">
            <button type="submit" class="btn btn-secondary w-100">검색</button>
        </div>
        <div class="col-md-1">
            <a href="/admin/recipes" class="btn btn-outline-secondary w-100">초기화</a>
        </div>
    </form>

    <!-- 레시피 목록 테이블 -->
    <div class="card">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
            <tr>
                <th style="width: 70px;">ID</th>
                <th>레시피명</th>
                <th style="width: 90px;" class="text-end">좋아요</th>
                <th style="width: 90px;" class="text-end">싫어요</th>
                <th style="width: 100px;" class="text-end">등록자수</th>
                <th style="width: 120px;">생성일</th>
                <th style="width: 100px;">작업</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${page.content}">
                <td th:text="${r.recipeId}"></td>
                <td th:text="${r.recipeName}"></td>
                <td class="text-end" th:text="${r.likeCount}"></td>
                <td class="text-end" th:text="${r.dislikeCount}"></td>
                <td class="text-end" th:text="|${r.bookmarkCount}명|"></td>
                <td th:text="${r.createdAt}"></td>
                <td>
                    <form th:if="${r.bookmarkCount == 0}"
                          th:action="@{|/admin/recipes/${r.recipeId}/delete|}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                    </form>
                    <span th:if="${r.bookmarkCount > 0}"
                          class="badge bg-secondary"
                          title="등록한 사용자가 있어 삭제할 수 없습니다">보호됨</span>
                </td>
            </tr>
            <tr th:if="${page.empty}">
                <td colspan="7" class="text-center text-muted py-4">결과가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav th:if="${page.totalPages > 0}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/recipes(page=${page.number - 1}, size=${page.size}, keyword=${keyword}, sort=${sort}, onlyDeletable=${onlyDeletable})}">이전</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|${page.number + 1} / ${page.totalPages}|"></span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/recipes(page=${page.number + 1}, size=${page.size}, keyword=${keyword}, sort=${sort}, onlyDeletable=${onlyDeletable})}">다음</a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
