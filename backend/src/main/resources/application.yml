spring:
  application:
    name: backend
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
    # OpenAI ChatModel은 AiConfig가 직접 만든다 (starter 미사용)
    openai:
      api-key: ${OPENAI_API_KEY}
    # transient 오류 내부 재시도: 최초 1회 + 재시도 2회.
    # 기본값(10회, 백오프 최대 3분)은 프론트 polling deadline(2분)과 stale 판정(10분)을 넘길 수 있어 캡핑한다.
    # Spring AI 2.x는 이 값을 RetryPolicy.maxRetries(최초 호출 제외 재시도 횟수)로 쓴다. 1.x의 3과 같은 동작이 2다.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework

app:
  security:
    admin-cookie-secure: false
  notification:
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    # 소비기한 알림 배치 실행 시각 (Asia/Seoul). "-"이면 정해진 시각 실행을 끈다
    expiry-cron: "0 0 9 * * *"
  push:
    receipt-check-delay-ms: ${PUSH_RECEIPT_CHECK_DELAY_MS:60000}
    expo-push-url: https://exp.host/--/api/v2/push/send
    expo-receipts-url: https://exp.host/--/api/v2/push/getReceipts
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  # 기능별 AI 공급자·모델 (#59). provider: openai | google-genai
  # 공급자를 바꾸면 해당 공급자의 API 키(OPENAI_API_KEY / GEMINI_API_KEY)가 필요하다
  ai:
    ocr:
      provider: ${AI_OCR_PROVIDER:openai}
      model: ${AI_OCR_MODEL:gpt-4o}
      max-tokens: 1024
    recipe:
      provider: ${AI_RECIPE_PROVIDER:google-genai}
      model: ${AI_RECIPE_MODEL:gemini-2.5-pro}
      temperature: 0.2
      max-tokens: 8000
    ingredient:
      provider: ${AI_INGREDIENT_PROVIDER:google-genai}
      model: ${AI_INGREDIENT_MODEL:gemini-flash-lite-latest}
      temperature: 0.1
      max-tokens: 5000

logging:
  level:
    root: INFO
    com.keepeat.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [userId=%X{userId:-anon}] %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 3600000
  refresh-expiration: 1209600000

firebase:
  key-path: ${FIREBASE_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
