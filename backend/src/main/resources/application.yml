spring:
  application:
    name: backend
  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework

app:
  security:
    admin-cookie-secure: false
  notification:
    retention-days: 90
  push:
    receipt-check-delay-ms: 60000

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o
  max-tokens: 1024

logging:
  level:
    root: INFO
    com.keepeat.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [userId=%X{userId:-anon}] %logger{36} - %msg%n"


jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 3600000
  refresh-expiration: 1209600000

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}

firebase:
  key-path: ${FIREBASE_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
