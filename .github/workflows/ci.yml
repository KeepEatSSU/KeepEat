name: CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  push:
    branches-ignore:
      - main
      - BE
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  build-test:
    name: Build & Test (Gradle)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keepeat_test
          POSTGRES_USER: keepeat
          POSTGRES_PASSWORD: keepeat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keepeat -d keepeat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon
