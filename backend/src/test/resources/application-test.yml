spring:
  datasource:
    url: jdbc:h2:mem:keepeat_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: test-gemini-key

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: localhost
    port: 25
    username: test
    password: test

openai:
  api-key: test-openai-key
  model: gpt-4o
  max-tokens: 1024

jwt:
  secret: test-jwt-secret-key-test-jwt-secret-key-test-jwt-secret-key
  access-expiration: 3600000
  refresh-expiration: 1209600000

firebase:
  key-path:

management:
  endpoints:
    web:
      exposure:
        include: health