spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/keepeat_test
    username: keepeat
    password: keepeat
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: test-gemini-key

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: localhost
    port: 25
    username: test
    password: test

openai:
  api-key: test-openai-key
  model: gpt-4o
  max-tokens: 1024

jwt:
  secret: test-jwt-secret-key-test-jwt-secret-key-test-jwt-secret-key
  access-expiration: 3600000
  refresh-expiration: 1209600000

app:
  oauth2:
    redirect-uri: http://localhost:3000/oauth2/redirect

management:
  endpoints:
    web:
      exposure:
        include: health
