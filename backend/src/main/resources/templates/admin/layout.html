<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">KeepEat Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/ingredients">KeepEat Admin</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="/admin/ingredients">식재료 관리</a>
            <a class="nav-link" href="/admin/recipes">레시피 관리</a>
        </div>
        <form method="post" th:action="@{/admin/logout}" class="d-flex">
            <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
        </form>
    </div>
</nav>
</body>
</html>
