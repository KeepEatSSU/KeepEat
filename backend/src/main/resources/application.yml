spring:
  application:
    name: backend
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
    # transient 오류 내부 재시도: 최초 1회 + 재시도 2회.
    # 기본값(10회, 백오프 최대 3분)은 프론트 polling deadline(2분)과 stale 판정(10분)을 넘길 수 있어 캡핑한다.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework

app:
  security:
    admin-cookie-secure: false
  notification:
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
  push:
    receipt-check-delay-ms: ${PUSH_RECEIPT_CHECK_DELAY_MS:60000}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o
  max-tokens: 1024

logging:
  level:
    root: INFO
    com.keepeat.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [userId=%X{userId:-anon}] %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 3600000
  refresh-expiration: 1209600000

firebase:
  key-path: ${FIREBASE_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
