spring:
  datasource:
    # Testcontainers JDBC URL: 첫 연결 때 postgres:18 컨테이너를 띄우고 테스트 JVM이 끝나면 정리한다 (#54)
    # TC_DAEMON=true: 여러 테스트 컨텍스트가 같은 컨테이너를 공유한다
    url: jdbc:tc:postgresql:18:///keepeat_test?TC_DAEMON=true
    username: keepeat
    password: keepeat
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  sql:
    init:
      mode: never

  # 스키마는 Flyway 마이그레이션으로 만들고 Hibernate는 validate만 한다.
  # 엔티티 변경 후 V{n}__*.sql 마이그레이션이 누락되면 테스트가 실패한다.
  flyway:
    enabled: true

  ai:
    google:
      genai:
        api-key: test-gemini-key
    openai:
      api-key: test-openai-key

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: localhost
    port: 25
    username: test
    password: test

jwt:
  secret: test-jwt-secret-key-test-jwt-secret-key-test-jwt-secret-key
  access-expiration: 3600000
  refresh-expiration: 1209600000

app:
  oauth2:
    redirect-uri: http://localhost:3000/oauth2/redirect
  push:
    expo-push-url: http://127.0.0.1:9/--/api/v2/push/send
    expo-receipts-url: http://127.0.0.1:9/--/api/v2/push/getReceipts
    receipt-check-delay-ms: 86400000
    send-poll-delay-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health
