<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{admin/layout :: head('마스터 식재료 관리')}"></head>
<body class="bg-light">
<nav th:replace="~{admin/layout :: nav}"></nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">마스터 식재료</h3>
        <a href="/admin/ingredients/new" class="btn btn-primary">+ 신규 추가</a>
    </div>

    <div th:if="${msg}" class="alert alert-success" role="alert">
        <span th:if="${msg == 'created'}">생성되었습니다.</span>
        <span th:if="${msg == 'updated'}">수정되었습니다.</span>
    </div>

    <form method="get" action="/admin/ingredients" class="row g-2 mb-3">
        <div class="col-md-3">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="식재료명 검색">
        </div>
        <div class="col-md-3">
            <select name="subCategoryId" class="form-select">
                <option value="">전체 서브카테고리</option>
                <option th:each="sc : ${subCategories}"
                        th:value="${sc.id}"
                        th:selected="${subCategoryId != null and subCategoryId == sc.id}"
                        th:text="|${sc.category.name} > ${sc.name}|"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select name="status" class="form-select">
                <option value="">전체 상태</option>
                <option th:each="s : ${statusOptions}"
                        th:value="${s}"
                        th:selected="${status != null and status == s}"
                        th:text="${s}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-secondary w-100">검색</button>
        </div>
        <div class="col-md-2">
            <a href="/admin/ingredients" class="btn btn-outline-secondary w-100">초기화</a>
        </div>
    </form>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th style="width: 80px;">ID</th>
                <th>이름</th>
                <th>카테고리</th>
                <th>서브카테고리</th>
                <th>상태</th>
                <th style="width: 120px;">작업</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${page.content}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.categoryName}"></td>
                <td th:text="${item.subCategoryName}"></td>
                <td>
                    <span th:if="${item.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                    <span th:if="${item.status.name() == 'PENDING'}" class="badge bg-warning text-dark">PENDING</span>
                </td>
                <td>
                    <a th:href="@{|/admin/ingredients/${item.id}/edit|}" class="btn btn-sm btn-outline-primary">수정</a>
                </td>
            </tr>
            <tr th:if="${page.empty}">
                <td colspan="5" class="text-center text-muted py-4">결과가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page.totalPages > 0}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/ingredients(page=${page.number - 1}, size=${page.size}, keyword=${keyword}, subCategoryId=${subCategoryId})}">이전</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|${page.number + 1} / ${page.totalPages}|"></span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/ingredients(page=${page.number + 1}, size=${page.size}, keyword=${keyword}, subCategoryId=${subCategoryId}, status=${status})}">다음</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
