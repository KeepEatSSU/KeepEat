spring:
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${DB_NAME}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 3600000
  refresh-expiration: 1209600000

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  security:
    admin-cookie-secure: true
  notification:
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
  push:
    receipt-check-delay-ms: ${PUSH_RECEIPT_CHECK_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 3600000
  refresh-expiration: 1209600000

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}

firebase:
  key-path: ${FIREBASE_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
