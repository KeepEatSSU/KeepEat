name: Deploy to EC2

on:
  push:
    branches:
      - BE
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  REMOTE_DIR: /home/ubuntu/app

jobs:
  deploy:
    name: Build jar, ship to EC2, restart container
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keepeat_test
          POSTGRES_USER: keepeat
          POSTGRES_PASSWORD: keepeat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keepeat -d keepeat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests (deploy gate)
        run: ./gradlew test --no-daemon

      - name: Build bootJar
        run: ./gradlew clean bootJar --no-daemon -x test

      - name: Rename jar to app.jar
        run: |
          set -e
          cd build/libs
          ls -la
          jar_file=$(ls *.jar | grep -v plain | head -n 1)
          mv "$jar_file" app.jar
          ls -la

      - name: Stage deploy bundle
        run: |
          set -e
          mkdir -p ../deploy-bundle
          cp build/libs/app.jar ../deploy-bundle/app.jar
          cp Dockerfile ../deploy-bundle/Dockerfile
          cp docker-compose.yml ../deploy-bundle/docker-compose.yml
          cp entrypoint.sh ../deploy-bundle/entrypoint.sh
          chmod +x ../deploy-bundle/entrypoint.sh
          ls -la ../deploy-bundle

      - name: Copy bundle to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-bundle/*"
          target: ${{ env.REMOTE_DIR }}
          strip_components: 1

      - name: Write .env on EC2 and restart container
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_PORT: ${{ secrets.PROD_DB_PORT }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          FIREBASE_KEY_BASE64: ${{ secrets.FIREBASE_KEY_BASE64 }}
          OAUTH2_REDIRECT_URI: ${{ secrets.OAUTH2_REDIRECT_URI }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PROD_DB_HOST,PROD_DB_PORT,DB_NAME,PROD_DB_USER,PROD_DB_PASSWORD,OPENAI_API_KEY,GEMINI_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,JWT_SECRET_KEY,MAIL_USERNAME,MAIL_PASSWORD,FIREBASE_KEY_BASE64,OAUTH2_REDIRECT_URI
          script: |
            set -e
            cd /home/ubuntu/app

            umask 077
            cat > .env <<ENVEOF
            PROD_DB_HOST=${PROD_DB_HOST}
            PROD_DB_PORT=${PROD_DB_PORT}
            DB_NAME=${DB_NAME}
            PROD_DB_USER=${PROD_DB_USER}
            PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            MAIL_USERNAME=${MAIL_USERNAME}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            FIREBASE_KEY_BASE64=${FIREBASE_KEY_BASE64}
            OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI}
            ENVEOF
            chmod 600 .env

            chmod +x entrypoint.sh
            docker compose up -d --build app
            docker image prune -f

            echo "Waiting for /actuator/health to report UP..."
            for i in $(seq 1 24); do
              if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
                echo "Health check passed (attempt $i)"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 120s"
            docker compose logs app --tail=200
            exit 1
