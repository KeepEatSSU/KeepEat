# 소비기한 알림 배치 측정 전용 프로필 (#51)
# 단독으로 켠다: SPRING_PROFILES_ACTIVE=perf (local은 재시작 때 스키마를 다시 만들어 섞지 않는다, #52)
app:
  notification:
    # 정해진 시각 실행을 끄고, 수동 트리거(POST /api/internal/perf/expiry-batch)로만 실행한다
    expiry-cron: "-"
  push:
    expo-push-url: ${EXPO_MOCK_BASE_URL:http://localhost:8089}/--/api/v2/push/send
    expo-receipts-url: ${EXPO_MOCK_BASE_URL:http://localhost:8089}/--/api/v2/push/getReceipts
    receipt-first-check-delay-ms: 30000
    receipt-retry-delay-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
